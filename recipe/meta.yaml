{% set name = "ansi2html" %}
{% set version = "1.9.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ae17e92f1d6cac0e67d367e07fb0ba8a23dac8f193fc5d7a8c8a50fe5ddd95a4

# Upstream source:
# https://github.com/pycontribs/ansi2html/blob/v1.9.5/pyproject.toml
build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv
  entry_points:
    - ansi2html=ansi2html.__main__:main
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=45.0.0
    - setuptools_scm >=7.0.0
    - toml
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - ansi2html
  commands:
    - pip check
    - ansi2html --help
    - ansi2html --version | grep -q {{ version }}
    - python -m pytest -ra tests
  requires:
    - pip
    - pytest
    - msys2-grep  # [win]

about:
  home: https://pypi.org/project/ansi2html
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: Convert text with ANSI color codes to HTML or to LaTeX.
  description: |
    ansi2html allows users to convert text with ANSI color codes
    to HTML or to Latex.
  doc_url: https://ansi2html.readthedocs.io
  dev_url: https://github.com/pycontribs/ansi2html

extra:
  recipe-maintainers:
    - nehaljwani
